name: CI

# Runs the backend test suite and the frontend lint/build on every push and
# pull request. Nothing enforced this before — a broken commit could reach
# main and deploy with no automated check at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
        env:
          # Tests use an in-memory SQLite DB (see tests/conftest.py); this only
          # satisfies Settings() so app import doesn't require a real database.
          DATABASE_URL: sqlite:///./ci_unused.sqlite3
          JWT_SECRET: ci-test-secret-not-for-production

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Build-time only; the real value is injected at deploy time by Vercel.
          NEXT_PUBLIC_API_URL: https://api-six-zeta-35.vercel.app

  frontend-tests:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
